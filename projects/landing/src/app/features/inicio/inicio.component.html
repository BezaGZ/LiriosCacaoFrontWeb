<lc-portada />
<lc-declaracion />

<!-- Las tres franjas alternan el lado de la foto. Sin alternar, la portada se
     lee como un catálogo: tres fichas iguales una debajo de otra. -->
<lc-banda
  [kicker]="floristeria.kicker"
  [titulo]="floristeria.titulo"
  [parrafos]="floristeria.parrafos"
  [enlace]="floristeria.enlace"
  [foto]="floristeria.foto" />

<!-- Eventos y jardin van JUNTOS, no en dos franjas. Que el lugar sea nuestro
     es la razon por la que el montaje sale distinto de precio; separados, el
     visitante leia dos servicios en vez de una ventaja. Los cuatro numerados
     van pegados debajo porque son el desglose de esta misma franja. -->
<lc-banda
  acento="evento"
  [invertida]="true"
  [kicker]="eventosJardin.kicker"
  [titulo]="eventosJardin.titulo"
  [parrafos]="eventosJardin.parrafos"
  [enlace]="eventosJardin.enlace"
  [foto]="eventosJardin.foto" />

<lc-incluimos />

<lc-app-banda />
