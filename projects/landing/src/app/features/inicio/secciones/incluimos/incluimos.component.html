<section class="incluimos" aria-labelledby="lc-incluimos">
  <div class="marco">
    <h2 id="lc-incluimos" class="visualmente-oculto">Lo que incluimos</h2>

    <ul class="rejilla">
      @for (cosa of c.cosas; track cosa.titulo) {
        <li [lcRevelar]="$index * 70">
          @switch (cosa.icono) {
            @case ('techo') {
              <svg class="icono" viewBox="0 0 30 30" aria-hidden="true" focusable="false">
                <path d="M7 25V13a8 8 0 0 1 16 0v12" />
                <path d="M11.5 25V13.5a3.5 3.5 0 0 1 7 0V25" />
                <path d="M3 25h24" />
              </svg>
            }
            @case ('decoracion') {
              <svg class="icono" viewBox="0 0 30 30" aria-hidden="true" focusable="false">
                <ellipse cx="11.5" cy="11" rx="5.5" ry="7" />
                <ellipse cx="20" cy="13.5" rx="5" ry="6.5" />
                <path d="M11.5 18.2c0 2.8-1.6 3.3-1.6 6.3M20 20.2c0 2.4 1.1 2.9 1.1 4.3" />
              </svg>
            }
            @case ('mesa') {
              <svg class="icono" viewBox="0 0 30 30" aria-hidden="true" focusable="false">
                <circle cx="15" cy="15.5" r="7" />
                <circle cx="15" cy="15.5" r="4" />
                <path d="M4 5.5v5a2 2 0 0 0 4 0v-5M6 10.5V24M25 5.5c-1.6 0-2.6 2-2.6 4.4 0 1.7 1.3 2.3 2.6 2.3V24" />
              </svg>
            }
            @case ('sonido') {
              <svg class="icono" viewBox="0 0 30 30" aria-hidden="true" focusable="false">
                <circle cx="8.5" cy="21.5" r="3.5" />
                <circle cx="21.5" cy="18.5" r="3.5" />
                <path d="M12 21.5V8l13-2.6v13.1" />
              </svg>
            }
          }

          <p class="rotulo">{{ cosa.titulo }}</p>
          <p class="texto">{{ cosa.texto }}</p>
        </li>
      }
    </ul>

    <p class="accion" [lcRevelar]="320">
      <a [routerLink]="c.enlace.ruta">{{ c.enlace.texto }}</a>
    </p>
  </div>
</section>
