<section class="portada">
  <picture>
    <source media="(max-width: 47.9375rem)" [srcset]="c.foto.movil">
    <img
      [src]="c.foto.escritorio"
      [alt]="c.foto.alt"
      fetchpriority="high"
      decoding="async">
  </picture>

  <!-- Igual que en las paginas interiores: la foto entra instantanea porque
       es la que mide el LCP; el texto encima es el que se desvanece. -->
  <div class="texto">
    <p class="kicker" lcRevelar>{{ c.kicker }}</p>
    <h1 class="titular" [lcRevelar]="90">{{ c.titulo }}</h1>
    <p class="entrada" [lcRevelar]="180">{{ c.entrada }}</p>

    <div class="acciones" [lcRevelar]="260">
      <a class="principal" [routerLink]="c.accionPrincipal.ruta">
        {{ c.accionPrincipal.texto }}
      </a>
      <a class="secundaria" [href]="c.accionSecundaria.ruta">
        {{ c.accionSecundaria.texto }}&nbsp;→
      </a>
    </div>
  </div>
</section>
