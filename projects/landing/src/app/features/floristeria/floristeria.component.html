<lc-portada-pagina
  [kicker]="c.kicker"
  [titulo]="c.titulo"
  [foto]="c.foto"
  [miga]="c.miga" />

<!-- La tira va pegada a la portada: son las dudas que alguien trae encima
     cuando acaba de llegar, no las que le quedan a media página. -->
<lc-tira-datos [datos]="c.detalles" />

<section class="entrada">
  <div class="marco">
    <p class="parrafo">{{ c.entrada }}</p>
  </div>
</section>

<!-- Los arreglos van aquí, pegados a la entrada: antes de leer nada, lo
     primero que aparece es flor. -->
<section class="arreglos" aria-labelledby="lc-arreglos">
  <div class="marco">
    <h2 id="lc-arreglos" class="arreglos-titulo" lcRevelar>{{ c.arreglosTitulo }}</h2>

    <ul class="tira">
      @for (arreglo of c.arreglos; track arreglo.titulo) {
        <li [lcRevelar]="80 + $index * 70">
          <a [href]="porArreglo(arreglo.titulo)" rel="noopener">
            <!-- Sin recuadro: son recortes con fondo transparente, y meterlos
                 en una caja les dibuja un borde que la foto no tiene. Lo único
                 que llevan detrás es un halo que los asienta. -->
            <span class="pozo">
              <img lcFoto [ngSrc]="arreglo.foto.src" [alt]="arreglo.foto.alt" fill sizes="(min-width: 48rem) 25vw, 50vw">
            </span>
            <span class="nombre">{{ arreglo.titulo }}</span>
          </a>
        </li>
      }
    </ul>

    <p class="arreglos-nota" [lcRevelar]="400">{{ c.arreglosNota }}</p>
  </div>
</section>

<section class="hacemos" aria-labelledby="lc-hacemos">
  <h2 id="lc-hacemos" class="visualmente-oculto">Lo que hacemos</h2>
  <ul class="lista">
    @for (item of c.queHacemos; track item.titulo) {
      <li [lcRevelar]="$index * 70">
        <h3>{{ item.titulo }}</h3>
        <p>{{ item.texto }}</p>
      </li>
    }
  </ul>
</section>

<lc-ocasiones />

<lc-cierre
  [titulo]="c.cierre.titulo"
  [parrafos]="c.cierre.parrafos"
  [boton]="c.cierre.boton"
  [enlace]="enlaceWhatsapp" />
