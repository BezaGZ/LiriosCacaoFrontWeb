<header class="barra">
  <a class="marca" routerLink="/">{{ negocio.nombre }}</a>

  <div class="acciones">
    <a class="pedir" [href]="negocio.app">Pedir en línea</a>

    <button
      #disparador
      type="button"
      class="lineas"
      [attr.aria-expanded]="abierto()"
      aria-controls="lc-menu"
      aria-label="Abrir menú"
      (click)="alternar()">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
  </div>
</header>

<lc-menu id="lc-menu" [abierto]="abierto()" (cerrar)="cerrar()" />
