<header class="barra">
  <!-- El lirio va como decoracion y no como <img>: el nombre del negocio ya
       esta escrito al lado, asi que repetirlo en un texto alternativo le hace
       decir dos veces lo mismo a quien usa lector de pantalla. -->
  <a class="marca" routerLink="/">
    <span class="lirio" aria-hidden="true"></span>
    {{ negocio.nombre }}
  </a>

  <div class="acciones">
    <!-- En pantalla grande los enlaces van a la vista: lo que se esconde
         detrás de las tres líneas recibe menos visitas, y aquí hay espacio
         de sobra para cinco. De tableta hacia abajo manda la hamburguesa. -->
    <nav class="enlaces" aria-label="Principal">
      <ul>
        @for (enlace of navegacion; track enlace.ruta) {
          <li>
            <a
              [routerLink]="enlace.ruta"
              routerLinkActive="activo"
              [routerLinkActiveOptions]="{ exact: enlace.ruta === '/' }">{{ enlace.texto }}</a>
          </li>
        }
      </ul>
    </nav>

    <a class="pedir" [href]="negocio.app">Pedir en línea</a>

    <button
      #disparador
      type="button"
      class="lineas"
      [attr.aria-expanded]="abierto()"
      aria-controls="lc-menu"
      aria-label="Abrir menú"
      (click)="alternar()">
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
      <span aria-hidden="true"></span>
    </button>
  </div>
</header>

<lc-menu id="lc-menu" [abierto]="abierto()" (cerrar)="cerrar()" />
