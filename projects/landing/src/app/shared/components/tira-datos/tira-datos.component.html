<section class="tira" [attr.aria-label]="etiqueta()">
  <ul class="lista">
    @for (dato of datos(); track dato.titulo) {
      <li>
        <!-- Los iconos van en linea y no como <img>: son cuatro trazos, pesan
             menos que la peticion que costaria traerlos, y heredan el color
             del acento sin que haya que exportar una version por tema. -->
        @switch (dato.icono) {
          @case ('precio') {
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M20.6 13.4 13.4 20.6a2 2 0 0 1-2.8 0l-7.2-7.2A2 2 0 0 1 2.8 12V4.8a2 2 0 0 1 2-2H12a2 2 0 0 1 1.4.6l7.2 7.2a2 2 0 0 1 0 2.8Z" />
              <circle cx="7.6" cy="7.6" r="1.2" />
            </svg>
          }
          @case ('entrega') {
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <path d="M2.8 6.4h11v9.2h-11z" />
              <path d="M13.8 9.8h3.6l3.8 3.6v2.2h-7.4z" />
              <circle cx="7" cy="18" r="2.1" />
              <circle cx="17.2" cy="18" r="2.1" />
            </svg>
          }
          @case ('calendario') {
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="3" y="5" width="18" height="16" rx="1.6" />
              <path d="M3 10h18M8 2.8v4M16 2.8v4" />
            </svg>
          }
          @case ('pago') {
            <svg class="icono" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
              <rect x="2.6" y="5" width="18.8" height="14" rx="1.6" />
              <path d="M2.6 9.6h18.8M6 14.6h4" />
            </svg>
          }
        }

        <span class="texto">
          <b class="titulo">{{ dato.titulo }}</b>
          <span class="detalle">{{ dato.detalle }}</span>
        </span>
      </li>
    }
  </ul>
</section>
