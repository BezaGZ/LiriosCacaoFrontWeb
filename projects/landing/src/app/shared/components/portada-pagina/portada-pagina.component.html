<header class="portada">
  <img
    [ngSrc]="foto().src"
    [alt]="foto().alt"
    [style.object-position]="foto().enfoque ?? null"
    fill
    priority
    sizes="100vw">

  <!-- La foto NO se desvanece: es el elemento que mide el LCP. Lo que entra
       suave es el texto de encima, que es lo que de verdad se percibe. -->
  <div class="texto">
    <p class="kicker" lcRevelar>{{ kicker() }}</p>
    <h1 class="titulo" [lcRevelar]="90">{{ titulo() }}</h1>
  </div>

  <nav class="miga" aria-label="Ruta" [lcRevelar]="200">
    <a routerLink="/">Inicio</a>
    <span aria-hidden="true">/</span>
    <span class="actual" aria-current="page">{{ miga() }}</span>
  </nav>
</header>
