<div class="layout-wrapper" [ngClass]="containerClass">
  <app-topbar></app-topbar>
  <div class="layout-main-container">
    <!--
      Sin pb-16: ese padding-bottom reservaba en movil el espacio de la barra
      de navegacion fija, y tenia sentido cuando el pie no existia en telefono.
      Ahora el pie si esta y reserva ese espacio el mismo, asi que el pb-16
      solo dejaba un hueco vacio de 56px entre el contenido y el pie.
    -->
    <div class="layout-main flex flex-col flex-1">
      <div class="flex-grow">
        <router-outlet></router-outlet>
      </div>
    </div>
    <!--
      El footer estaba oculto en movil (hidden md:block), asi que en telefono
      no se veia nunca: ni el credito ni el aviso de derechos. Y el sitio se
      usa sobre todo en movil. Ahora se muestra siempre; el espacio para la
      barra de navegacion fija lo reserva el propio footer.
    -->
    <app-footer></app-footer>
  </div>
  <div class="layout-mask animate-fadein"></div>

  <!-- Toast general -->
  <p-toast></p-toast>

  <!--
    Toast de confirmación del carrito.

    Va abajo y no arriba: en top-center el recuadro caía justo encima de la
    segunda fila de tarjetas y tapaba el botón de agregar. Ningún truco de CSS
    arregla que una caja visible tape lo que hay debajo — había que moverla.

    Y la clase 'toast-sin-bloqueo' hace dos cosas: deja que los clics
    atraviesen el contenedor (que ocupa una franja completa aunque el aviso sea
    chico) y lo levanta por encima de la barra inferior del móvil.
  -->
  <p-toast key="cart-confirm" position="bottom-center" styleClass="toast-sin-bloqueo">
    <ng-template let-message pTemplate="message">
      <div class="flex flex-col gap-3 p-4" style="min-width: 300px;">
        <div class="flex items-start gap-3">
          <i class="pi pi-check-circle text-green-500" style="font-size: 1.5rem;"></i>
          <div class="flex-1">
            <div class="font-semibold text-lg text-[#1a1a1a] dark:text-white">{{message.summary}}</div>
            <div class="text-sm mt-1 text-[#757575] dark:text-gray-300">{{message.detail}}</div>
          </div>
        </div>
        <div class="flex gap-2 mt-2">
          <button
            pButton
            label="Seguir comprando"
            class="flex-1 !text-gray-700 dark:!text-black"
            [outlined]="true"
            severity="secondary"
            (click)="cartConfirmation.continueShopping()"
            style="padding: 0.75rem 1rem; font-size: 0.875rem;">
          </button>
          <button
            pButton
            label="Ir al carrito"
            class="flex-1 !text-white"
            (click)="cartConfirmation.goToCart()"
            style="background: #452317; border-color: #452317; padding: 0.75rem 1rem; font-size: 0.875rem;">
          </button>
        </div>
      </div>
    </ng-template>
  </p-toast>
</div>
