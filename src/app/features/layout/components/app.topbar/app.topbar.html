<!--
  La navegacion son enlaces <a routerLink>, no <div (click)>.
  Con divs Google no puede seguir la navegacion (solo llegaba a /productos
  por el sitemap), no se puede navegar con teclado, y no se puede abrir una
  categoria en pestana nueva ni ver la URL al pasar el mouse.
-->
<div>
  <!-- Escritorio -->
  <div class="hidden md:flex items-center justify-between px-6 py-2 shadow-sm sticky top-0 bg-[#FFF8F1] z-40">

    <a class="layout-topbar-logo flex items-center" routerLink="/" aria-label="Lirio y Cacao, ir al inicio">
      <img src="assets/img/logo_cafe.png" alt="Lirio y Cacao" class="h-18 w-auto object-contain mr-3" />
    </a>

    <nav class="flex justify-center items-center gap-4" aria-label="Navegación principal">
      <a routerLink="/"
         [attr.aria-current]="isHome ? 'page' : null"
         class="flex flex-col items-center cursor-pointer relative text-[#452317]
                transition transform hover:scale-110 hover:text-[#704727]">
        <img src="assets/icons/inicio.svg" alt="" aria-hidden="true"
             class="w-7 h-5 mb-1 transition-transform duration-200" />
        <span class="text-sm">Inicio</span>
        <div *ngIf="isHome" class="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-10 h-0.5 bg-[#452317] rounded-full"></div>
      </a>

      <a *ngFor="let cat of categorias"
         routerLink="/productos" [queryParams]="{ category: cat.id }"
         [attr.aria-current]="currentCategory === cat.id ? 'page' : null"
         class="flex flex-col items-center cursor-pointer relative text-[#452317]
                transition transform hover:scale-110 hover:text-[#704727]">
        <img [src]="'assets/icons/' + cat.icono + '.svg'" alt="" aria-hidden="true" class="w-5 h-5 mb-1" />
        <span class="text-sm">{{ cat.nombre }}</span>
        <div *ngIf="currentCategory === cat.id" class="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-10 h-0.5 bg-[#452317] rounded-full"></div>
      </a>
    </nav>

    <a routerLink="/carrito"
       [attr.aria-current]="isCart ? 'page' : null"
       [attr.aria-label]="'Carrito, ' + cartItemCount + ' producto(s)'"
       class="relative flex flex-col items-center cursor-pointer text-[#452317]
              transition transform hover:scale-110 hover:text-[#704727]">
      <img src="assets/icons/carrito.svg" alt="" aria-hidden="true" class="w-5 h-5 mb-1" />
      <span class="text-sm">Carrito</span>
      <div *ngIf="isCart" class="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-10 h-0.5 bg-[#452317] rounded-full"></div>
      <span *ngIf="cartItemCount > 0"
            class="absolute -top-1 -right-2 bg-red-500 text-white text-[10px] font-bold rounded-full px-[6px] py-[2px] leading-none animate-bounce">
        {{ mostrarCantidadCarrito() }}
      </span>
    </a>

  </div>

  <!-- Movil: barra inferior fija -->
  <nav class="md:hidden fixed bottom-0 left-0 z-50 w-full h-20 bg-white border-t border-gray-200 flex justify-around items-center pb-4 pt-3"
       aria-label="Navegación principal">

    <a routerLink="/"
       [attr.aria-current]="isHome ? 'page' : null"
       class="flex flex-col items-center cursor-pointer relative text-[#452317]
              transition transform duration-200
              hover:scale-110 hover:-translate-y-1
              active:scale-110 active:animate-bounce md:active:scale-100 md:active:animate-none">
      <img src="assets/icons/inicio.svg" alt="" aria-hidden="true" class="w-7 h-5 mb-1" />
      <span class="text-xs">Inicio</span>
      <div *ngIf="isHome" class="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-8 h-0.5 bg-[#452317] rounded-full"></div>
    </a>

    <a *ngFor="let cat of categorias"
       routerLink="/productos" [queryParams]="{ category: cat.id }"
       [attr.aria-current]="currentCategory === cat.id ? 'page' : null"
       class="flex flex-col items-center cursor-pointer relative text-[#452317]
              transition transform duration-200
              hover:scale-110 hover:-translate-y-1
              active:scale-110 active:animate-bounce md:active:scale-100 md:active:animate-none">
      <img [src]="'assets/icons/' + cat.icono + '.svg'" alt="" aria-hidden="true"
           class="w-5 h-5 mb-1 transition-transform duration-200" />
      <span class="text-xs">{{ cat.nombre }}</span>
      <div *ngIf="currentCategory === cat.id" class="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-8 h-0.5 bg-[#452317] rounded-full"></div>
    </a>

    <a routerLink="/carrito"
       [attr.aria-current]="isCart ? 'page' : null"
       [attr.aria-label]="'Carrito, ' + cartItemCount + ' producto(s)'"
       class="flex flex-col items-center cursor-pointer relative text-[#452317]
              transition transform duration-200
              hover:scale-110 hover:-translate-y-1
              active:scale-110 active:animate-bounce md:active:scale-100 md:active:animate-none">
      <img src="assets/icons/carrito.svg" alt="" aria-hidden="true" class="w-5 h-5 mb-1" />
      <span class="text-xs">Carrito</span>
      <div *ngIf="isCart" class="absolute -bottom-1 left-1/2 transform -translate-x-1/2 w-8 h-0.5 bg-[#452317] rounded-full"></div>
      <span *ngIf="cartItemCount > 0"
            class="absolute -top-0 -right-0 bg-red-500 text-white text-[10px] font-bold rounded-full px-[6px] py-[2px] leading-none animate-bounce">
        {{ mostrarCantidadCarrito() }}
      </span>
    </a>

  </nav>
</div>
