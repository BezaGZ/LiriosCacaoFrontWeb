<!-- Seccion de Categorias - grid 2x2 en movil, fila de 4 en escritorio -->
<section class="py-12 md:py-16 bg-[#FFF8F1]">
  <!-- Encabezado compacto -->
  <div class="mb-6 md:mb-8 px-6 md:px-12 lg:px-20 max-w-7xl mx-auto">
    <h2 class="text-2xl md:text-3xl font-bold !text-[#452317] mb-2">Explora por Categoría</h2>
    <p class="!text-[#704727] text-sm md:text-base opacity-80">
      Encuentra exactamente lo que buscas
    </p>
  </div>

  <!--
    Antes esto era un scroll horizontal: en un movil de 390px solo se veia la
    primera tarjeta y las otras tres dependian de que el visitante leyera
    "Desliza para ver mas". Ahora es una cuadricula: 2 columnas en movil
    (las 4 categorias visibles sin scroll) y 4 columnas desde tablet.
  -->
  <div class="px-6 md:px-12 lg:px-20 max-w-7xl mx-auto">
    <div class="cat-grid">
      <button
        *ngFor="let cat of categories"
        (click)="goToCategory(cat.slug)"
        [attr.aria-label]="'Ver ' + cat.title"
        class="group h-full
               flex flex-col items-center justify-start text-center
               bg-white hover:bg-[#FFF3E6]
               border-2 border-[#e8e8e8] hover:border-[#452317]
               rounded-2xl
               px-3 py-4 md:px-5 md:py-5
               transition-all duration-300
               shadow-sm hover:shadow-md
               cursor-pointer"
      >
        <!-- Titulo -->
        <span class="font-bold !text-[#452317] text-sm md:text-base leading-tight">
          {{ cat.title }}
        </span>
        <!-- Descripcion: en movil se permite que corte en varias lineas -->
        <span class="!text-[#704727] text-xs md:text-sm leading-snug mt-1 opacity-90">
          {{ cat.desc }}
        </span>
      </button>
    </div>
  </div>
</section>
