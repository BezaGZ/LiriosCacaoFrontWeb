<div class="product-card">
  <div class="product-image-container" (click)="emitCustomize()">
    <img
      [src]="imagenFallo ? placeholder : currentImageUrls.base"
      (error)="onImageError()"
      [alt]="product.title"
      class="product-image"
    />
    <img
      *ngIf="currentImageUrls.topping && !capaFallo && !imagenFallo"
      [src]="currentImageUrls.topping"
      (error)="onLayerError()"
      alt=""
      class="product-image product-overlay"
    />

    <!-- Lo que se cotiza (flores, eventos) abre WhatsApp -->
    <button
      *ngIf="seCotiza"
      class="whatsapp-btn"
      [attr.aria-label]="'Consultar ' + product.title + ' por WhatsApp'"
      (click)="emitWhatsApp($event)"
    >
      <i class="pi pi-whatsapp"></i>
    </button>

    <!-- Lo que se compra en línea va al carrito -->
    <button
      *ngIf="!seCotiza"
      class="add-to-cart-btn"
      [attr.aria-label]="'Agregar ' + product.title + ' al carrito'"
      (click)="emitAddToCart($event)"
    >
      <i class="pi pi-shopping-cart"></i>
    </button>
  </div>

  <div class="product-info">
    <h3 class="product-title">{{ product.title }}</h3>
    <p class="product-price">
      <ng-container *ngIf="tienePrecio; else consultar">
        <span *ngIf="precioEsDesde" class="product-price-desde">Desde </span>{{ product.price | currency }}
      </ng-container>
      <ng-template #consultar>Consultar precio</ng-template>
    </p>
  </div>
</div>
